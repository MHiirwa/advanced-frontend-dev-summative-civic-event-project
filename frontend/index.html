<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Find civic, ALU campus and community events in Rwanda, register, and follow announcements and promos.">
  <title>CivicEvents</title><link rel="icon" type="image/svg+xml" href="assets/images/civicevents-logo.svg"><link rel="icon" type="image/png" href="assets/images/civicevents-favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><script src="https://cdn.tailwindcss.com"></script>
  <script src="js/core/tailwind-config.js"></script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="public-page" data-page="home">
  <!-- Shared header (js/shared/layout.js) is rendered into #app-header; footer into #app-footer. -->
  <div id="app-header"></div>

  <main id="main" tabindex="-1">
    <!-- Hero: copy on the left, the Kigali photo on the right. -->
    <section class="home-split mx-auto w-full max-w-7xl px-4" aria-labelledby="hero-title">
      <div>
        <h1 id="hero-title" class="home-title">Civic, campus and community events in Rwanda</h1>
        <p class="home-lede">Find Umuganda activities, public dialogues and ALU campus events. Register in a few clicks and follow announcements from organisers.</p>
        <div class="hero-actions" id="hero-actions">
          <a class="btn btn-primary" href="pages/events.html">Explore upcoming events</a>
        </div>
        <p id="umuganda-note" class="home-umuganda" role="note"></p>
      </div>
      <img class="home-hero-photo" src="assets/images/kigali-skyline.jpg" alt="Kigali skyline with the Convention Centre and green hills" width="1376" height="768">
    </section>

    <section class="mx-auto w-full max-w-7xl px-4 section-tight" aria-labelledby="communities-title">
      <h2 id="communities-title" class="home-h2">Two ways in</h2>
      <div id="community-tiles" class="community-tiles"></div>
    </section>

    <!-- Signed-in visitors only: the next real events from the API (nothing is shown to guests). -->
    <section class="mx-auto w-full max-w-7xl px-4 section-tight pt-0" aria-labelledby="upcoming-title" id="upcoming-section" hidden>
      <div class="section-heading"><h2 id="upcoming-title" class="home-h2 !mb-0">Coming up</h2><a class="text-link text-sm" href="pages/events.html">All events</a></div>
      <ul id="upcoming-events" class="event-rows" aria-live="polite"></ul>
    </section>
  </main>

  <div id="app-footer"></div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/core/config.js"></script>
  <script src="js/core/ui.js"></script>
  <script src="js/core/civic.js"></script>
  <script src="js/core/auth.js"></script>
  <script src="js/core/api.js"></script>
  <script src="js/shared/notifications.js"></script>
  <script src="js/shared/layout.js"></script>
  <script src="js/shared/components.js"></script>
  <script src="js/shared/app.js"></script>
  <script src="js/pages/home.js"></script>
</body>
</html>
