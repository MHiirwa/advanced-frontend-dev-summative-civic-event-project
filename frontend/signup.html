<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account · CivicEvents+</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/core/tailwind-config.js"></script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="font-sans antialiased">
  <a href="#main" class="skip-link">Skip to main content</a>

  <div class="grid min-h-screen lg:grid-cols-2">
    <aside class="relative hidden overflow-hidden bg-brand-900 p-12 text-white lg:flex lg:flex-col lg:justify-between" aria-hidden="true">
      <div class="flex items-center gap-3">
        <svg class="h-11 w-11" viewBox="0 0 40 40"><rect width="40" height="40" rx="11" fill="#fff"/><rect x="9" y="11" width="22" height="19" rx="3.5" fill="none" stroke="#156555" stroke-width="2.4"/><path d="M9 17h22" stroke="#156555" stroke-width="2.4"/><path d="M15 8v5M25 8v5" stroke="#156555" stroke-width="2.4" stroke-linecap="round"/><circle cx="20" cy="24" r="2.6" fill="#e8912d"/></svg>
        <span class="font-display text-2xl font-semibold">CivicEvents<span class="text-accent">+</span></span>
      </div>
      <div>
        <p class="font-display text-5xl font-semibold leading-tight">Join your<br>community.</p>
        <p class="mt-6 max-w-md text-lg text-brand-100">Create a free account to register for events, leave feedback and get notified when something new is published.</p>
      </div>
      <p class="text-sm text-brand-200">It takes less than a minute.</p>
      <div class="pointer-events-none absolute -bottom-24 -right-24 h-80 w-80 rounded-full bg-brand-700/60"></div>
      <div class="pointer-events-none absolute -right-8 top-24 h-40 w-40 rounded-full bg-accent/20"></div>
    </aside>

    <main id="main" tabindex="-1" class="flex items-center justify-center px-4 py-12 sm:px-8">
      <div class="w-full max-w-md">
        <div class="mb-8 flex items-center gap-2 lg:hidden">
          <svg class="h-10 w-10" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="11" fill="#156555"/><rect x="9" y="11" width="22" height="19" rx="3.5" fill="none" stroke="#fff" stroke-width="2.4"/><path d="M9 17h22" stroke="#fff" stroke-width="2.4"/><path d="M15 8v5M25 8v5" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><circle cx="20" cy="24" r="2.6" fill="#e8912d"/></svg>
          <span class="font-display text-2xl font-semibold text-brand-900">CivicEvents<span class="text-accent">+</span></span>
        </div>

        <h1 class="font-display text-4xl font-semibold text-brand-900">Create your account</h1>
        <p class="mt-2 text-muted">Already registered? <a href="login.html" class="font-semibold text-brand-700 underline underline-offset-2 hover:text-brand-900">Log in</a></p>

        <form id="signup-form" class="mt-8 space-y-5" novalidate>
          <div id="form-alert" class="hidden" aria-live="assertive"></div>

          <div data-field>
            <label class="label" for="full_name">Full name</label>
            <input class="input" type="text" id="full_name" name="full_name" autocomplete="name" required placeholder="Jane Doe">
            <p data-error id="full_name-error" class="field-error hidden"></p>
          </div>

          <div data-field>
            <label class="label" for="email">Email address</label>
            <input class="input" type="email" id="email" name="email" autocomplete="email" inputmode="email" required placeholder="you@example.com">
            <p data-error id="email-error" class="field-error hidden"></p>
          </div>

          <div data-field>
            <label class="label" for="password">Password</label>
            <div class="relative">
              <input class="input pr-12" type="password" id="password" name="password" autocomplete="new-password" required aria-describedby="strength-label password-rules">
              <button type="button" id="toggle-password" class="absolute right-2 top-1/2 -translate-y-1/2 rounded-lg p-2 text-muted hover:bg-brand-50" aria-label="Show password" aria-pressed="false"></button>
            </div>

            <!-- Strength meter -->
            <div class="mt-3" aria-hidden="true">
              <div class="grid grid-cols-5 gap-1.5" id="strength-bar">
                <span class="strength-seg"></span><span class="strength-seg"></span><span class="strength-seg"></span><span class="strength-seg"></span><span class="strength-seg"></span>
              </div>
            </div>
            <p class="mt-1.5 text-sm" id="strength-label" aria-live="polite">Password strength: <span class="font-semibold" id="strength-text">enter a password</span></p>

            <ul id="password-rules" class="mt-2 grid gap-1 text-sm text-muted sm:grid-cols-2">
              <li data-rule="length"></li>
              <li data-rule="lower"></li>
              <li data-rule="upper"></li>
              <li data-rule="number"></li>
              <li data-rule="special"></li>
            </ul>
            <p data-error id="password-error" class="field-error hidden"></p>
          </div>

          <div data-field>
            <label class="label" for="confirm_password">Confirm password</label>
            <input class="input" type="password" id="confirm_password" name="confirm_password" autocomplete="new-password" required>
            <p data-error id="confirm_password-error" class="field-error hidden"></p>
          </div>

          <button type="submit" id="submit-btn" class="btn btn-primary w-full !py-3">Create account</button>
        </form>
      </div>
    </main>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/core/config.js"></script>
  <script src="js/core/ui.js"></script>
  <script src="js/core/auth.js"></script>
  <script src="js/core/api.js"></script>
  <script src="js/shared/notifications.js"></script>
  <script src="js/shared/layout.js"></script>
  <script src="js/pages/signup.js"></script>
</body>
</html>
