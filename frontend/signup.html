<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account · CivicEvents</title><link rel="icon" type="image/svg+xml" href="assets/images/civicevents-logo.svg"><link rel="icon" type="image/png" href="assets/images/civicevents-favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><script src="https://cdn.tailwindcss.com"></script>
  <script src="js/core/tailwind-config.js"></script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="auth-page font-sans antialiased">
  <a href="#main" class="skip-link">Skip to main content</a>
  <a href="index.html" class="auth-back"><svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>Back to home</a>
  <main id="main" tabindex="-1" class="auth-main">
    <div class="auth-wrap">
      <a href="index.html" class="auth-logo" aria-label="CivicEvents home"><img src="assets/images/civicevents-logo.svg" alt="" width="36" height="36"><span>CivicEvents</span></a>
      <h1 class="auth-title">Create your account</h1>
      <p class="auth-sub">Free for everyone. Takes under a minute.</p>
      <div class="auth-card">
        <form id="signup-form" class="space-y-4" novalidate>
          <div id="form-alert" class="hidden" aria-live="assertive"></div>

          <div data-field>
            <label class="label" for="full_name">Full name</label>
            <input class="input" type="text" id="full_name" name="full_name" autocomplete="name" required placeholder="Your name">
            <p data-error id="full_name-error" class="field-error hidden"></p>
          </div>

          <div data-field>
            <label class="label" for="email">Email</label>
            <input class="input" type="email" id="email" name="email" autocomplete="email" inputmode="email" required placeholder="you@example.com">
            <p data-error id="email-error" class="field-error hidden"></p>
          </div>

          <div data-field>
            <label class="label" for="password">Password</label>
            <div class="relative">
              <input class="input pr-12" type="password" id="password" name="password" autocomplete="new-password" required placeholder="At least 8 characters" aria-describedby="strength-label password-rules">
              <button type="button" id="toggle-password" class="absolute right-2 top-1/2 -translate-y-1/2 rounded-lg p-2 text-muted hover:bg-brand-50" aria-label="Show password" aria-pressed="false"></button>
            </div>

            <!-- Strength meter -->
            <div class="mt-3" aria-hidden="true">
              <div class="grid grid-cols-5 gap-1.5" id="strength-bar">
                <span class="strength-seg"></span><span class="strength-seg"></span><span class="strength-seg"></span><span class="strength-seg"></span><span class="strength-seg"></span>
              </div>
            </div>
            <p class="mt-1.5 text-sm" id="strength-label" aria-live="polite">Password strength: <span class="font-semibold" id="strength-text">enter a password</span></p>

            <ul id="password-rules" class="mt-2 grid gap-1 text-sm text-muted sm:grid-cols-2">
              <li data-rule="length"></li>
              <li data-rule="lower"></li>
              <li data-rule="upper"></li>
              <li data-rule="number"></li>
              <li data-rule="special"></li>
            </ul>
            <p data-error id="password-error" class="field-error hidden"></p>
          </div>

          <div data-field>
            <label class="label" for="confirm_password">Confirm password</label>
            <input class="input" type="password" id="confirm_password" name="confirm_password" autocomplete="new-password" required>
            <p data-error id="confirm_password-error" class="field-error hidden"></p>
          </div>

          <button type="submit" id="submit-btn" class="btn btn-primary w-full !py-2.5">Create account</button>
        </form>
      </div>
      <p class="auth-foot">Already have an account? <a href="login.html" class="font-semibold text-brand-700 hover:underline">Log in</a></p>
    </div>
  </main>


  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/core/config.js"></script>
  <script src="js/core/ui.js"></script><script src="js/core/civic.js"></script>
  <script src="js/core/auth.js"></script>
  <script src="js/core/api.js"></script>
  <script src="js/shared/notifications.js"></script>
  <script src="js/shared/layout.js"></script>
  <script src="js/pages/signup.js"></script>
</body>
</html>
