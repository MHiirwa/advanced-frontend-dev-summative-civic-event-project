<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in · CivicEvents</title><link rel="icon" type="image/svg+xml" href="assets/images/civicevents-logo.svg"><link rel="icon" type="image/png" href="assets/images/civicevents-favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><script src="https://cdn.tailwindcss.com"></script>
  <script src="js/core/tailwind-config.js"></script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="auth-page font-sans antialiased">
  <a href="#main" class="skip-link">Skip to main content</a>
  <a href="index.html" class="auth-back"><svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>Back to home</a>
  <main id="main" tabindex="-1" class="auth-main">
    <div class="auth-wrap">
      <a href="index.html" class="auth-logo" aria-label="CivicEvents home"><img src="assets/images/civicevents-logo.svg" alt="" width="36" height="36"><span>CivicEvents</span></a>
      <h1 class="auth-title">Log in to CivicEvents</h1>
      <p class="auth-sub">Welcome back. Enter your details below.</p>
      <div class="auth-card">
        <form id="login-form" class="space-y-4" novalidate>
          <div id="form-alert" class="hidden" aria-live="assertive"></div>

          <div data-field>
            <label class="label" for="email">Email</label>
            <input class="input" type="email" id="email" name="email" autocomplete="email" inputmode="email" required placeholder="you@example.com">
            <p data-error id="email-error" class="field-error hidden"></p>
          </div>

          <div data-field>
            <div class="flex items-baseline justify-between gap-2"><label class="label" for="password">Password</label><a href="forgot-password.html" class="text-sm font-medium text-brand-700 hover:underline">Forgot password?</a></div>
            <div class="relative">
              <input class="input pr-12" type="password" id="password" name="password" autocomplete="current-password" required placeholder="Your password">
              <button type="button" id="toggle-password" class="absolute right-2 top-1/2 -translate-y-1/2 rounded-lg p-2 text-muted hover:bg-brand-50" aria-label="Show password" aria-pressed="false"></button>
            </div>
            <p data-error id="password-error" class="field-error hidden"></p>
          </div>

          <label class="inline-flex items-center gap-2 text-sm text-ink"><input type="checkbox" id="remember" class="h-4 w-4 rounded"> Remember me <span class="text-muted">(stay signed in on this device)</span></label>
          <button type="submit" id="submit-btn" class="btn btn-primary w-full !py-2.5">Log in</button>
        </form>
      </div>
      <p class="auth-foot">Don’t have an account? <a href="signup.html" class="font-semibold text-brand-700 hover:underline">Sign up</a></p>
    </div>
  </main>


  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/core/config.js"></script>
  <script src="js/core/ui.js"></script><script src="js/core/civic.js"></script>
  <script src="js/core/auth.js"></script>
  <script src="js/core/api.js"></script>
  <script src="js/shared/notifications.js"></script>
  <script src="js/shared/layout.js"></script>
  <script src="js/pages/login.js"></script>
</body>
</html>
